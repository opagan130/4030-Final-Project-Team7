
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cell Movement Dashboard</title>

    <link rel="stylesheet"
          href="static/style.css">

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>
    <header>
        <h1>Cell Movement Exploration Dashboard</h1>
        <p>Ground-Truth Cell Tracking Data | Use Case 1</p>
    </header>

    <main>
        
<section class="filters">

    <!-- Row 1: Sequence and Track IDs -->
    <div class="filter-row">

        <div>
            <label for="sequence">Video Sequence</label>
            <select id="sequence"></select>
        </div>

        <div class="track-filter">
            <label for="trackSearch">Highlight Track IDs</label>

            <input
                type="text"
                id="trackSearch"
                placeholder="Search Track ID..."
                autocomplete="off"
            >

            <div id="trackOptions" class="track-options"></div>
            <div id="selectedTracks" class="selected-tracks"></div>
        </div>

    </div>

    <!-- Row 2: Frame controls -->
    <div class="filter-row">

        <div>
            <label for="startFrame">Start Frame</label>
            <input type="number" id="startFrame">
        </div>

        <div>
            <label for="endFrame">End Frame</label>
            <input type="number" id="endFrame">
        </div>

        <div class="frame-slider">
            <label>Frame Range Slider</label>

            <div class="slider-container">
                <input type="range" id="startSlider"
                       min="0" max="100" value="0">

                <input type="range" id="endSlider"
                       min="0" max="100" value="100">
            </div>

            <small id="frameRangeLabel">Frames: 0 - 100</small>
        </div>

        <button id="updateBtn">Update Graph</button>

    </div>

</section>

        <!-- Dashboard visualizations -->
        <section class="dashboard-grid">

            <!-- Your visualization -->
            <div class="panel">
                <h2>Cell Movement Trajectory Plot</h2>
                <div id="trajectoryPlot"></div>
                <div id="trackDetails" class="track-details">
                   <h3>Selected Track Details</h3>
                    <p>Click a colored trajectory to view its details.</p>
                </div>
            </div>

            <!-- Emma's visualization -->
            <div class="panel">
                <h2>Track Duration Distribution</h2>

                <div id="durationPlot" class="placeholder">
                    visualization
                </div>
            </div>

            <!-- Shumail's visualization -->
            <div class="panel division-panel">
                <h2>Cell Division Analysis</h2>

                <div id="divisionPlot" class="placeholder">
                    visualization
                </div>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="static/dashboard-pages.js"></script>
</body>
</html>
